<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head><body>
<div class="frame" style="flex-direction:column;align-items:stretch;gap:30px">
  <div style="text-align:center">
    <span class="eyebrow">Practice that feels like a game</span>
    <h2 style="margin-top:12px">A habit you'll <span class="indigo">want</span> to keep</h2>
  </div>
  <div style="display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;flex:1">
    <div class="card" style="padding:26px;display:flex;flex-direction:column;justify-content:space-between">
      <p style="font-size:16px;font-weight:700;color:#6E6E73">Mocki grows up with you</p>
      <div style="display:flex;justify-content:space-between;align-items:flex-end">
        <img src="../../../web/public/avatars/level-1.png" width="57" height="57">
<img src="../../../web/public/avatars/level-2.png" width="68" height="68">
<img src="../../../web/public/avatars/level-3.png" width="79" height="79">
<img src="../../../web/public/avatars/level-4.png" width="90" height="90">
<img src="../../../web/public/avatars/level-5.png" width="101" height="101">
<img src="../../../web/public/avatars/level-6.png" width="112" height="112">
      </div>
      <div style="height:12px;border-radius:99px;background:#EEEEF3;overflow:hidden"><div style="width:62%;height:100%;background:#34C759;border-radius:99px"></div></div>
    </div>
    <div style="display:grid;gap:20px">
      <div class="card" style="padding:22px 26px;display:flex;align-items:center;gap:18px">
        <span style="width:60px;height:60px;border-radius:18px;background:#FFF3E0;display:grid;place-items:center;font-size:32px">🔥</span>
        <div><p style="font-size:28px;font-weight:800">12 days in a row</p><p style="font-size:15px;color:#6E6E73">One missed day a week won't break it</p></div>
      </div>
      <div class="card" style="padding:22px 26px">
        <p style="font-size:16px;font-weight:700">This week's missions</p>
        <div style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-size:15px"><span>Finish 3 interviews</span><b style="color:#A16A00">+60 XP</b></div><div style="height:9px;border-radius:99px;background:#EEEEF3;margin-top:6px"><div style="width:66%;height:100%;border-radius:99px;background:#5856D6"></div></div></div>
<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-size:15px"><span>Share your progress</span><b style="color:#A16A00">+40 XP</b></div><div style="height:9px;border-radius:99px;background:#EEEEF3;margin-top:6px"><div style="width:100%;height:100%;border-radius:99px;background:#34C759"></div></div></div>
<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-size:15px"><span>Practice on 2 days</span><b style="color:#A16A00">+40 XP</b></div><div style="height:9px;border-radius:99px;background:#EEEEF3;margin-top:6px"><div style="width:50%;height:100%;border-radius:99px;background:#5856D6"></div></div></div>
      </div>
      <div class="card" style="padding:18px 26px;display:flex;align-items:center;justify-content:space-between">
        <p style="font-size:16px;font-weight:700">14 badges to earn</p>
        <div style="display:flex"><img src="../../../web/public/badges/first-session.png" width="52" height="52" style="margin-left:-8px">
<img src="../../../web/public/badges/scored-80.png" width="52" height="52" style="margin-left:-8px">
<img src="../../../web/public/badges/real-mode.png" width="52" height="52" style="margin-left:-8px">
<img src="../../../web/public/badges/quick-start.png" width="52" height="52" style="margin-left:-8px">
<img src="../../../web/public/badges/steady-pace.png" width="52" height="52" style="margin-left:-8px"></div>
      </div>
    </div>
  </div>
</div>
</body></html>
