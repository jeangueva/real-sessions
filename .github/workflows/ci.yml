name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: the older run's answer is
# about code nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # The progress store has one suite that runs against both its in-memory
      # and its Postgres implementation. Skipping the second half in CI would
      # leave the two free to disagree — which is exactly the bug it caught
      # when it was first written.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: realsessions
          POSTGRES_PASSWORD: realsessions
          POSTGRES_DB: realsessions_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U realsessions"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install
        run: |
          npm ci
          npm --prefix web ci

      - name: Typecheck
        run: |
          npm run typecheck
          npm --prefix web run typecheck

      - name: Test
        # TEST_DATABASE_URL, never DATABASE_URL: these tests write real rows.
        env:
          TEST_DATABASE_URL: postgresql://realsessions:realsessions@localhost:5432/realsessions_test
        run: |
          npm test
          npm --prefix web test

      - name: Build
        run: npm --prefix web run build

  image:
    # Only on main: a pull request has already been proven by `test`, and
    # building the image on every push to every branch buys little.
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the deployable image
        # Built but not pushed anywhere. This exists to catch a Dockerfile that
        # stopped working — which has already happened once, when devDependencies
        # were omitted and the image shipped without tsx.
        run: docker build -t realsessions:${{ github.sha }} .
