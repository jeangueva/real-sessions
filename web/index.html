<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` paints under the notch and the home indicator;
         the safe-area insets pad the content back out. `resizes-content`
         makes Android's keyboard shrink the layout the way iOS's does. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- The status bar takes the colour of the top of the page. Two values,
         one per scheme; the script below and theme.ts correct them when the
         theme was chosen in the app rather than by the OS. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F0E9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141311" />
    <title>Mockio | Practica para estudiar, trabajar y conversar</title>
    <meta
      name="description"
      content="Practica tesis, escenarios académicos, entrevistas, conversaciones difíciles e intuición. Educación y Profesional, 100% gratis. Apoyo opcional desde USD 1."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Link previews. Absolute URLs because a scraper resolves nothing and
         runs no JavaScript; `%VITE_SITE_URL%` is substituted at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mockio" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Mockio | Practica para estudiar, trabajar y conversar" />
    <meta
      property="og:description"
      content="Practica tesis, escenarios académicos, entrevistas, conversaciones difíciles e intuición. Educación y Profesional, 100% gratis. Apoyo opcional desde USD 1."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The mark: Mocki, the parrot, in three shapes on the product's indigo.
         SVG for every browser that takes it, a PNG for the rest, and a
         square one for the iPhone home screen, which rounds it itself. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@500&family=Almarai:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      /**
       * Applies the stored theme before the first paint.
       *
       * In React this would run after hydration, and the page would flash the
       * dark palette on its way to a light one — which is worse than either
       * theme. Deliberately duplicated from src/lib/theme.ts and deliberately
       * tiny: it reads one key and sets one attribute.
       */
      (function () {
        try {
          var stored = localStorage.getItem("realsessions.theme");
          // Light unless someone chose dark, or chose to follow a machine
          // that is set to dark. Mirrors storedChoice in src/lib/theme.ts.
          var light =
            stored !== "dark" &&
            !(stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (light) document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.style.colorScheme = light ? "light" : "dark";
          var bar = light ? "#F4F0E9" : "#141311";
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (tag) {
            tag.setAttribute("content", bar);
          });
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
