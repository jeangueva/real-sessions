<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockio — practise the interview in English</title>
    <meta
      name="description"
      content="Real job interviews in English, out loud, against the company you are applying to — then told exactly what to fix."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Link previews. Absolute URLs because a scraper resolves nothing and
         runs no JavaScript; `%VITE_SITE_URL%` is substituted at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mockio" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Mockio — practise the interview in English" />
    <meta
      property="og:description"
      content="Real job interviews in English, out loud, against the company you are applying to — then told exactly what to fix."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- An inline SVG mark, so the tab has an icon on the first paint and
         without a request. Lowercase m, on the product's own ink. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101010'/%3E%3Ctext x='32' y='45' font-family='Helvetica,Arial,sans-serif' font-size='40' font-weight='600' fill='%23DEDBC8' text-anchor='middle'%3Em%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <script>
      /**
       * Applies the stored theme before the first paint.
       *
       * In React this would run after hydration, and the page would flash the
       * dark palette on its way to a light one — which is worse than either
       * theme. Deliberately duplicated from src/lib/theme.ts and deliberately
       * tiny: it reads one key and sets one attribute.
       */
      (function () {
        try {
          var stored = localStorage.getItem("realsessions.theme");
          var light =
            stored === "light" ||
            (stored !== "dark" &&
              window.matchMedia("(prefers-color-scheme: light)").matches);
          if (light) document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.style.colorScheme = light ? "light" : "dark";
        } catch (error) {
          /* Blocked storage. The dark theme is what :root declares anyway. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
